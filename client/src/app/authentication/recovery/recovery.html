<div class = "Main Wrapper">
    <div
        class = "Section-Wrapper"
        FancySlideUpDown>

        <FancyTooltip
            class = "Section-Header-Tooltip"
            [Message] = "SectionHeaderErrorMessageSignal()"
            [Active] = "SectionHeaderErrorActiveSignal()"
            [Fixed] = "false"
            [ArrowBottom] = "true">
        </FancyTooltip>

        <FancyContainer class = "Content-Section-Wrapper" [ngClass] = "InterfaceService.GetStatusClasses()">
            <div class = "Content-Section">
                <div class = "Section-Title-Container">
                    <span
                        class = "Section-Title Text-Title"
                        [FancyTypewriter] = "(InterfaceService.T().RecoveryIntro)">
                    </span>

                    <FancyDropdown
                        class = "Recovery-Dropdown"
                        [Type] = "InterfaceService.InterfaceType()"
                        [Items] = "RecoveryOptions()"
                        [SelectedItem] = "SelectedOption()"
                        (SelectionChange) = "OnSelectionChange($event)">
                    </FancyDropdown>
                </div>

                @if (RecoveryResults().length > 0) {
                    <div
                        class = "Recovery-Result-Container"
                        [class.Is-Split] = "RecoveryResults().length > 1">

                        <span
                            class = "Recovery-Result-Main-Label"
                            [FancyTypewriter] = "ActiveRecoveryDescriptor().ResultLabel">
                        </span>

                        <div class = "Recovery-Result-Parts-Wrapper">
                            @for (Item of RecoveryResults(); track $index) {
                                <div class = "Recovery-Result-Part">
                                    <span
                                        class = "Recovery-Result-Sub-Label"
                                        [FancyTypewriter] = "Item.Label">
                                    </span>
                                    <span class = "Recovery-Result-Value">{{ Item.Value }}</span>
                                </div>
                            }
                        </div>
                    </div>
                }

                <div
                    class = "Form-Fields-Wrapper"
                    [class.Is-Password-Mode] = "ActiveRecoveryDescriptor().IsPasswordMode">
                    <div class = "Form-Fields-Horizontal-Group">
                        <div class = "Animation-Container Left-Field">
                            <div class = "Input-Field-Wrapper">
                                <FancyTextbox
                                    #FirstField
                                    class = "Input-Field"
                                    [Placeholder] = "ActiveRecoveryDescriptor().FirstField?.Placeholder ?? ''"
                                    [Icon] = "ActiveRecoveryDescriptor().FirstField?.Icon"
                                    [OnlyAllow] = "ActiveRecoveryDescriptor().FirstField?.OnlyAllow"
                                    [MaximumLength] = "ActiveRecoveryDescriptor().FirstField?.MaximumLength"
                                    [Tabindex] = "ActiveRecoveryDescriptor().IsPasswordMode ? -1 : undefined">
                                </FancyTextbox>
                                <FancyTooltip
                                    class = "Input-Field-Tooltip"
                                    [Message] = "FirstFieldErrorMessageSignal()"
                                    [Active] = "FirstFieldErrorActiveSignal()"
                                    [Fixed] = "false"
                                    [ArrowLeft] = "true">
                                </FancyTooltip>
                            </div>
                        </div>
                        <span
                            class = "Separator-Text"
                            [FancyTypewriter] = "InterfaceService.T().OR">
                        </span>
                        <div class = "Animation-Container Right-Field">
                            <div class = "Input-Field-Wrapper">
                                <FancyTextbox
                                    #SecondField
                                    class = "Input-Field"
                                    [Placeholder] = "ActiveRecoveryDescriptor().SecondField?.Placeholder ?? ''"
                                    [Icon] = "ActiveRecoveryDescriptor().SecondField?.Icon"
                                    [OnlyAllow] = "ActiveRecoveryDescriptor().SecondField?.OnlyAllow"
                                    [MaximumLength] = "ActiveRecoveryDescriptor().SecondField?.MaximumLength"
                                    [Tabindex] = "ActiveRecoveryDescriptor().IsPasswordMode ? -1 : undefined">
                                </FancyTextbox>
                                <FancyTooltip
                                    class = "Input-Field-Tooltip"
                                    [Message] = "SecondFieldErrorMessageSignal()"
                                    [Active] = "SecondFieldErrorActiveSignal()"
                                    [Fixed] = "false"
                                    [ArrowLeft] = "true">
                                </FancyTooltip>
                            </div>
                        </div>
                    </div>

                    <div class = "Unique-Textbox-Wrapper">
                        <div class = "Animation-Container Unique-Field">
                            <div class = "Input-Field-Wrapper">
                                <FancyTextbox
                                    #UniqueField
                                    class = "Input-Field"
                                    [Placeholder] = "ActiveRecoveryDescriptor().UniqueField?.Placeholder ?? InterfaceService.T().UserIdentifier"
                                    [Icon] = "ActiveRecoveryDescriptor().UniqueField?.Icon ?? 'user'"
                                    [Tabindex] = "!ActiveRecoveryDescriptor().IsPasswordMode ? -1 : undefined">
                                </FancyTextbox>
                                <FancyTooltip
                                    class = "Input-Field-Tooltip"
                                    [Message] = "UniqueFieldErrorMessageSignal()"
                                    [Active] = "UniqueFieldErrorActiveSignal()"
                                    [Fixed] = "false"
                                    [ArrowLeft] = "true">
                                </FancyTooltip>
                            </div>
                        </div>
                    </div>
                </div>

                <div class = "Buttons-Container">
                    <FancyButton
                        class = "Action-Button"
                        Style = "Accent"
                        [Label] = "(InterfaceService.T().Continue)"
                        (Up) = "HandleRecovery()">
                    </FancyButton>
                </div>
            </div>
        </FancyContainer>
    </div>
</div>
